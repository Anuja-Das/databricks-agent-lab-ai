[project]
name = "databricks-agent-lab-ai"
requires-python = ">=3.11"

dependencies = [
    "databricks-sdk>=0.32.0",
    "mlflow>=2.16.0",
    "databricks-agents>=0.8.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "openai>=1.0.0",
    "playwright>=1.0.0",
]

[dependency-groups]
dev = [
    "poethepoet>=0.29.0",
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["tests"]
